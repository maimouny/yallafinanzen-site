.wrap{max-width:560px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{font-weight:800;letter-spacing:.03em;font-size:15px}.brand b{color:var(--g)}
.lg{display:flex;gap:6px}.lg a{font-size:13px;font-weight:600;color:var(--m);text-decoration:none;padding:4px 9px;border-radius:99px}.lg a.on{background:var(--v);color:var(--bg)}
.vid{position:relative;border-radius:24px;overflow:hidden;background:var(--v);aspect-ratio:9/16;max-width:100%;max-height:78vh;margin:8px auto 24px;box-shadow:0 14px 40px rgba(25,51,41,.18)}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
/* Video-Kasten erst zeigen, wenn ein Video wirklich lädt – sonst springt die Seite (CLS) */
.vid:not(.ready){display:none}
.snd{position:absolute;bottom:14px;inset-inline-start:14px;background:var(--l);color:var(--v);border:0;font:inherit;font-weight:700;font-size:15px;padding:10px 16px;border-radius:99px;cursor:pointer}
h1{font-size:46px;line-height:1.02;font-weight:800;letter-spacing:-.03em;text-wrap:balance}
.ar h1{font-weight:800;letter-spacing:0;line-height:1.35;font-size:52px}
h1 em{font-style:normal;color:var(--g);display:block}
.lead{font-size:17px;color:var(--m);margin:12px 0 18px}
.panel{background:var(--bg);border:1.5px solid var(--line);border-radius:22px;padding:6px 18px;box-shadow:0 10px 30px rgba(25,51,41,.08)}
.panel details{border-bottom:1.5px solid var(--line)}.panel details:last-child{border:0}
summary{list-style:none;display:flex;align-items:center;gap:14px;padding:20px 0;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:12px}
.n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--v);color:var(--bg);font-weight:700;display:flex;align-items:center;justify-content:center}
details.first .n{background:var(--l);color:var(--v)}
.ico{flex:none;width:50px;height:50px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ico svg{width:26px;height:26px}.ico img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
summary h3{flex:1;min-width:0;font-size:19px;font-weight:700;line-height:1.25}.ar summary h3{font-weight:700;line-height:1.5;font-size:22px}
.chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--v);display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.more{padding:0 0 16px;font-size:16px;line-height:1.55;color:var(--m)}
.ar .more{font-size:19px;line-height:1.7}
.hint{font-size:13px;color:var(--m);text-align:center;margin-top:10px}
/* form */
form{display:flex;flex-direction:column;gap:16px;color:var(--t)}
fieldset{border:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;font-size:16px;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px;cursor:pointer}
.opt:has(input:checked){border-color:var(--g);background:var(--tint)}
.opt input{accent-color:var(--g);width:18px;height:18px;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:8px}
input[type=tel]{font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;direction:ltr;text-align:start}
input[type=tel]:focus{outline:2px solid var(--g);border-color:var(--g)}
.ok{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--m);cursor:pointer}
.ok input{accent-color:var(--g);width:20px;height:20px;flex:none;margin-top:1px}
.note{font-weight:600;color:var(--v);font-size:15px}
.btns{display:flex;flex-direction:column;gap:8px}
.b:not(body){display:block;text-align:center;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:99px;border:0;cursor:pointer;text-decoration:none}
.b.wa{background:var(--wa);color:var(--bg)}.b.ig{background:var(--v);color:var(--bg)}

.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
.done{font-size:17px;font-weight:600;color:var(--v);background:var(--tint);border-radius:14px;padding:16px;line-height:1.5}
.b[aria-disabled=true]{opacity:.4}
.msg{font-size:13px;color:var(--g);min-height:1em;text-align:center}
.wafb{display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:700;color:var(--v)}.ar .wafb{font-size:18px}
.call{margin-top:22px;text-align:center;font-size:15px;color:var(--m)}
.call b{display:block;font-size:22px;color:var(--v);margin-top:2px;direction:ltr;user-select:all}
.legal{font-size:12px;color:var(--m);margin-top:22px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

.tk{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:14px}
.tk label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.tk input{position:absolute;opacity:0;width:0;height:0}
.tk .bx{flex:none;width:28px;height:28px;border:2px solid var(--g);border-radius:8px;margin-top:3px;display:grid;place-items:center;font-weight:800;color:var(--v);line-height:1}
.tk input:checked+.bx{background:var(--l);border-color:var(--v)}
.tk input:checked+.bx::after{content:"\2713"}
.tk input:focus-visible+.bx{outline:3px solid var(--g);outline-offset:2px}
.tk .tx{font-size:17px;line-height:1.55;color:var(--t);min-width:0;overflow-wrap:anywhere}.ar .tk .tx{font-size:19px;line-height:1.7}
.tk .tx b{display:block;color:var(--v)}
.mis{background:#fdf1f0;border-radius:14px;padding:14px;margin-top:18px}.mis b{color:#b3261e;display:block;margin-bottom:6px;font-size:18px}.mis p{font-size:17px;line-height:1.6;margin:0}.ar .mis p{font-size:19px;line-height:1.7}.ar .mis b{font-size:20px}
.dv .ib{min-width:0;flex:1}
.diy{text-align:center;margin:0 0 40px}.diy p{font-size:19px;margin:6px 0 16px;color:var(--t)}.ar .diy p{font-size:21px}

.c .ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-auto-flow:dense;margin-bottom:28px}

ar:{h:'دليلك لأهم التأمينات في ألمانيا وإزاي تشترك فيهم',lead:'اضغط على أي تأمين وشوف ليه مهم 👇🏼',plan:'لو عايز تبدأ فيهم، دي الخطوات 👇🏼',inv:'الاستثمار في ألمانيا خطوة بخطوة',
 i:[{n:'تأمين المسؤولية الشخصية',d:'Haftpflicht',s:'لو غلطت في حق حد وسببتله ضرر',q:'ليه مهم؟ مثال',big:'المطالبة ممكن توصل لملايين اليوروهات',p:['ماشي بالعجلة، وفجأة خبطت راجل كبير في السن. اتكسر وركه واتعمله عملية، ومش هيقدر يشتغل تاني.','في ألمانيا إنت مسؤول بالقانون عن كل الضرر اللي سببته، من فلوسك الخاصة ومن غير حد: المستشفى، العلاج، الدخل اللي خسره، وممكن معاش طول عمره.','يعني ممكن تفضل تدفع طول حياتك.'],fix:'تأمين المسؤولية بيدفع الضرر ده عنك، وبيدافع عنك لو المطالبة مش في محلها.'},
 {n:'تأمين العجز عن العمل',d:'BU',s:'لو مقدرتش تشتغل في مهنتك',q:'إيه اللي يحصل لو مقدرتش تشتغل؟',big:'تقريبًا واحد من كل 4 موظفين بيحصله ده قبل المعاش',p:['ضغط نفسي، اكتئاب، مشكلة في الضهر، حادثة، أو مرض. مش لازم يكون حاجة كبيرة عشان شغلك يقف.','بعد 6 أسابيع صاحب الشغل بيبطل يدفع مرتبك. الكاسة بتدفع جزء لفترة محدودة، وبعدها الدولة بتدفع مبلغ صغير، وبس لو صحتك مش مسمحالك تشتغل تقريبًا في أي شغلانة.','والإيجار؟ والعيلة؟ والأولاد؟ المصاريف مكملة، والدخل وقف.'],fix:'عشان كده تأمين العجز عن العمل من أهم التأمينات: بيدفعلك مبلغ كل شهر لو مقدرتش تشتغل في مهنتك، عشان حياتك وحياة عيلتك تفضل زي ما هي.'},
 {n:'تأمين العربية',d:'Kfz',s:'إجباري لو عندك عربية',q:'ليه الاختيار مهم؟',big:'حادثة واحدة ممكن تكلف ملايين',p:['في ألمانيا مينفعش تسوق عربية من غير تأمين المسؤولية للعربية.','لو عملت حادثة واتصاب حد، التكاليف ممكن توصل لملايين. والتأمين الإجباري بيغطي الناس التانيين بس، مش عربيتك.','وفيه فرق كبير في السعر والتغطية بين الشركات.'],fix:'بقارنلك وبختارلك التغطية المناسبة، ولعربيتك كمان (Teilkasko أو Vollkasko) لو محتاجها.'},
 {n:'تأمين الحماية القانونية',d:'Rechtsschutz',s:'لو دخلت في مشكلة قانونية',q:'ليه مهم؟ مثال',big:'قضية واحدة ممكن تكلف آلاف اليوروهات',p:['صاحب الشغل فصلك من غير سبب، أو صاحب الشقة مش راضي يرجعلك التأمين، أو حد خبطك بالعربية وبيقول إنها غلطتك.','من غير تأمين بتدفع المحامي والمحكمة بنفسك. ناس كتير بتتنازل عن حقها عشان كده.'],fix:'تأمين الحماية القانونية بيدفع المحامي والمحكمة، عشان تاخد حقك من غير ما تخاف من التكاليف.'},
 {n:'تأمين محتويات البيت',d:'Hausrat',s:'لكل اللي عنده شقة أو بيت',q:'ليه مهم؟ مثال',big:'كل حاجتك ممكن تروح في ليلة',p:['حريقة في المطبخ، ماسورة اتكسرت، أو حرامي دخل الشقة. العفش، الأجهزة، اللابتوب، الهدوم، كله راح.','إنك تشتري كل ده من جديد ممكن يكلف عشرات الآلاف من اليوروهات.'],fix:'تأمين محتويات البيت بيعوضك بسعر الحاجة الجديدة، عشان تقدر تبدأ من تاني بسرعة.'}]},
de:{h:'Dein Guide zu den wichtigsten Versicherungen in Deutschland und wie du sie abschließt',lead:'Tippe auf eine Versicherung und sieh, warum sie wichtig ist 👇🏼',plan:'Wenn du damit anfangen willst, hier die Schritte 👇🏼',inv:'Investieren in Deutschland, Schritt für Schritt',
 i:[{n:'Privathaftpflicht',d:'',s:'Wenn du jemandem aus Versehen einen Schaden zufügst',q:'Warum wichtig? Ein Beispiel',big:'Forderungen können in die Millionen gehen',p:['Du fährst Fahrrad und stößt einen älteren Mann um. Er bricht sich die Hüfte, wird operiert und kann nie wieder arbeiten.','In Deutschland haftest du gesetzlich für den ganzen Schaden, mit deinem eigenen Geld und ohne Obergrenze: Krankenhaus, Behandlung, sein Verdienstausfall, eventuell eine lebenslange Rente.','Das kann dich dein ganzes Leben lang verfolgen.'],fix:'Die Haftpflicht zahlt diesen Schaden für dich und wehrt unberechtigte Forderungen ab.'},
 {n:'Berufsunfähigkeitsversicherung',d:'BU',s:'Wenn du deinen Beruf nicht mehr ausüben kannst',q:'Was passiert, wenn du nicht mehr arbeiten kannst?',big:'Etwa jeder 4. Arbeitnehmer wird vor der Rente berufsunfähig',p:['Psychische Belastung, Depression, Rücken, ein Unfall oder eine Krankheit. Es muss nichts Großes sein, damit du nicht mehr arbeiten kannst.','Nach 6 Wochen zahlt dein Arbeitgeber kein Gehalt mehr. Die Krankenkasse zahlt eine Zeit lang einen Teil, danach zahlt der Staat nur wenig, und nur wenn du fast gar keinen Job mehr machen kannst.','Und die Miete? Die Familie? Die Kinder? Die Kosten laufen weiter, das Einkommen nicht.'],fix:'Deshalb ist die BU eine der wichtigsten Versicherungen: Sie zahlt dir jeden Monat eine Rente, wenn du deinen Beruf nicht mehr ausüben kannst, damit dein Leben und das deiner Familie weiterläuft.'},
 {n:'Kfz-Versicherung',d:'',s:'Pflicht, wenn du ein Auto hast',q:'Warum die Wahl wichtig ist',big:'Ein Unfall kann Millionen kosten',p:['In Deutschland darfst du ohne Kfz-Haftpflicht nicht fahren.','Wenn bei einem Unfall jemand verletzt wird, können die Kosten in die Millionen gehen. Die Pflichtversicherung zahlt nur für die anderen, nicht für dein Auto.','Und zwischen den Anbietern gibt es große Unterschiede bei Preis und Leistung.'],fix:'Ich vergleiche für dich und wähle den passenden Schutz, auf Wunsch auch für dein eigenes Auto (Teil- oder Vollkasko).'},
 {n:'Rechtsschutzversicherung',d:'',s:'Wenn du in einen Rechtsstreit gerätst',q:'Warum wichtig? Ein Beispiel',big:'Ein Rechtsstreit kann Tausende Euro kosten',p:['Dein Arbeitgeber kündigt dir ohne Grund, der Vermieter gibt die Kaution nicht zurück, oder jemand fährt dir ins Auto und behauptet, du warst schuld.','Ohne Versicherung zahlst du Anwalt und Gericht selbst. Viele verzichten deshalb auf ihr Recht.'],fix:'Die Rechtsschutzversicherung zahlt Anwalt und Gericht, damit du zu deinem Recht kommst, ohne Angst vor den Kosten.'},
 {n:'Hausratversicherung',d:'',s:'Für alle mit eigener Wohnung oder Haus',q:'Warum wichtig? Ein Beispiel',big:'Alles, was du hast, kann in einer Nacht weg sein',p:['Ein Brand in der Küche, ein geplatztes Rohr oder ein Einbruch. Möbel, Geräte, Laptop, Kleidung, alles weg.','Alles neu zu kaufen kann Zehntausende Euro kosten.'],fix:'Die Hausratversicherung ersetzt dir alles zum Neuwert, damit du schnell neu anfangen kannst.'}]},
en:{h:'Your guide to the most important insurances in Germany and how to get them',lead:'Tap an insurance to see why it matters 👇🏼',plan:'Want to get started? Here are the steps 👇🏼',inv:'Investing in Germany, step by step',
 i:[{n:'Personal liability insurance',d:'Haftpflicht',s:'If you accidentally cause someone damage',q:'Why it matters: an example',big:'Claims can reach millions of euros',p:['You are cycling and knock over an elderly man. He breaks his hip, needs surgery and can never work again.','In Germany you are legally liable for all of it, with your own money and without a limit: hospital, treatment, his lost income, possibly a lifelong pension.','That can follow you for the rest of your life.'],fix:'Liability insurance pays this damage for you and fights claims that are not justified.'},
 {n:'Disability insurance',d:'BU',s:'If you can no longer work in your job',q:'What happens if you can no longer work?',big:'About 1 in 4 employees becomes unable to work before retirement',p:['Stress, depression, back problems, an accident or an illness. It does not take much to stop you from working.','After 6 weeks your employer stops paying your salary. Health insurance pays part of it for a while, then the state pays only a little, and only if you can hardly do any job at all.','And the rent? The family? The kids? The costs keep coming, the income stops.'],fix:'That is why disability insurance is one of the most important: it pays you every month if you can no longer work in your job, so your life and your family\'s stays the same.'},
 {n:'Car insurance',d:'Kfz',s:'Mandatory if you own a car',q:'Why the choice matters',big:'One accident can cost millions',p:['In Germany you cannot drive without car liability insurance.','If someone is injured in an accident, costs can run into the millions. The mandatory cover only pays for others, not for your car.','And prices and cover differ a lot between providers.'],fix:'I compare for you and pick the right cover, also for your own car (partial or full cover) if you need it.'},
 {n:'Legal protection insurance',d:'Rechtsschutz',s:'If you end up in a legal dispute',q:'Why it matters: an example',big:'One legal dispute can cost thousands of euros',p:['Your employer fires you without reason, your landlord keeps your deposit, or someone hits your car and says it was your fault.','Without insurance you pay the lawyer and the court yourself. Many people give up their rights because of that.'],fix:'Legal protection insurance pays the lawyer and the court, so you get your rights without fearing the costs.'},
 {n:'Household contents insurance',d:'Hausrat',s:'For everyone with a flat or house',q:'Why it matters: an example',big:'Everything you own can be gone in one night',p:['A kitchen fire, a burst pipe or a burglary. Furniture, devices, laptop, clothes, all gone.','Buying everything again can cost tens of thousands of euros.'],fix:'Contents insurance replaces your things at new value, so you can start again quickly.'}]}

var REV={"ar": {"h": "رأيك يهمني! قيّمني لو اتبسطت معايا!", "sub": "4.9 ★ من أكثر من 100 تقييم على Google", "i": [{"q": "«كدكتور عربي في ألمانيا مكنتش متأكد إزاي أجمع صح بين التأمين الصحي الخاص والمعاش وبناء الثروة. كان مهم عندي إن التزاماتي العائلية ووضعي الدولي يتاخدوا في الاعتبار. الاستشارة كانت واضحة ومنظمة ومن غير أي ضغط. النهارده عارف بالظبط إيه خطوتي الجاية.»", "n": "علي ز.", "r": "طبيب، توبينغن · مترجم من الألمانية"}, {"q": "«قبل الاستشارة كانت لدي عقود ادخار مختلفة، لكن بدون خطة واضحة. حلّل كريم معي أهدافي وهامشي الشهري ومدى استعدادي للمخاطرة. الآن لدي استراتيجية واضحة للاحتياطي وبناء الثروة على المدى الطويل ومستقبلي المالي في ألمانيا.»", "n": "منيب أ.", "r": "مهندس، شتوتغارت · مترجم من الألمانية"}, {"q": "«أردت شراء عقار في ألمانيا، لكنني لم أكن أعرف كم رأس المال الخاص المناسب. ساعدتني الاستشارة على تقييم التأمين والعبء طويل المدى بشكل واقعي. كان العمل مع كريم رائعًا، وأنصح به بشدة.»", "n": "حبيبة ت.", "r": "معلمة، ميونخ · مترجم من الألمانية"}, {"q": "«كمغترب كان من المفيد جدًا لي أن تُشرح المواضيع المالية والتأمينية الألمانية المعقدة بطريقة مفهومة. كما أن التواصل بالعربية والإنجليزية والألمانية سهّل أشياء كثيرة. لأول مرة شعرت أنني أفهم قراراتي المالية حقًا.»", "n": "أحمد ح.", "r": "لاعب تنس طاولة في الدوري الألماني، مانهايم · مترجم من الألمانية"}]}, "de": {"h": "Deine Meinung zählt! Bewerte mich, wenn du zufrieden warst!", "sub": "4,9 ★ aus 100+ Google-Bewertungen", "i": [{"q": "„Als arabischer Arzt in Deutschland war ich unsicher, wie ich PKV, Altersvorsorge und Vermögensaufbau sinnvoll verbinden kann. Besonders wichtig war mir, dass meine familiären Verpflichtungen und meine internationale Lebenssituation berücksichtigt werden. Die Beratung war verständlich strukturiert und ohne Druck. Heute weiß ich genau, welche Schritte ich als Nächstes gehen muss.“", "n": "Ali Z.", "r": "Arzt, Tübingen"}, {"q": "„Vor der Beratung hatte ich verschiedene Sparverträge, aber keinen klaren Plan. Karim hat mit mir meine Ziele, meinen monatlichen Spielraum und meine Risikobereitschaft analysiert. Jetzt habe ich eine verständliche Strategie für Rücklagen, den langfristigen Vermögensaufbau und meine finanzielle Zukunft in Deutschland.“", "n": "Moneeb A.", "r": "Ingenieur, Stuttgart"}, {"q": "„Ich wollte in Deutschland eine Immobilie kaufen, wusste aber nicht, wie viel Eigenkapital sinnvoll ist. Die Beratung hat mir geholfen, die Absicherung und langfristige Belastung realistisch einzuschätzen. Es war super, mit Karim zu arbeiten. Ich kann ihn nur weiterempfehlen.“", "n": "Habiba T.", "r": "Lehrerin, München"}, {"q": "„Als Expat war es für mich besonders hilfreich, dass die komplexen deutschen Finanz- und Versicherungsthemen verständlich erklärt wurden. Auch die Kommunikation auf Arabisch, Englisch und Deutsch hat vieles einfacher gemacht. Ich hatte zum ersten Mal das Gefühl, meine finanziellen Entscheidungen wirklich zu verstehen.“", "n": "Ahmed H.", "r": "Tischtennis-Bundesligaspieler, Mannheim"}]}, "en": {"h": "Your opinion matters! Rate me if you were happy!", "sub": "4.9 ★ from 100+ Google reviews", "i": [{"q": "“As an Arab doctor in Germany, I wasn’t sure how to combine private health insurance, retirement planning and building wealth in a sensible way. It mattered to me that my family obligations and my international situation were taken into account. The consultation was clearly structured and without pressure. Today I know exactly what my next steps are.”", "n": "Ali Z.", "r": "Doctor, Tübingen · translated from German"}, {"q": "“Before the consultation I had several savings contracts but no clear plan. Karim went through my goals, my monthly budget and my risk tolerance with me. Now I have a clear strategy for my reserves, long-term wealth building and my financial future in Germany.”", "n": "Moneeb A.", "r": "Engineer, Stuttgart · translated from German"}, {"q": "“I wanted to buy property in Germany but didn’t know how much equity made sense. The consultation helped me realistically assess the protection and long-term costs. Working with Karim was great. I can only recommend him.”", "n": "Habiba T.", "r": "Teacher, Munich · translated from German"}, {"q": "“As an expat, it was especially helpful that the complex German finance and insurance topics were explained clearly. Being able to communicate in Arabic, English and German also made many things easier. For the first time I felt I really understood my financial decisions.”", "n": "Ahmed H.", "r": "Table tennis Bundesliga player, Mannheim · translated from German"}]}};

var CX={"ar": [{"n": "التأمين الصحي", "d": "KV", "s": "إجباري لكل واحد في ألمانيا", "big": "حكومي ولا خاص؟ الفرق كبير في السعر والخدمة", "p": ["في ألمانيا لازم يكون عندك تأمين صحي. بس حكومي (GKV) ولا خاص (PKV)؟ الاختيار بيعتمد على دخلك وشغلك وعيلتك، وصعب ترجع فيه بعدين."], "have": "خاص (PKV)", "no": "حكومي (GKV)", "mn": "التأمين الصحي: حكومي، هل الخاص يناسبني؟", "opt": 1}, {"n": "المعاش الخاص", "d": "Altersvorsorge", "s": "ده معاشك لما تكبر", "big": "المعاش من الدولة لوحده مش هيكفي", "p": ["المعاش الحكومي بيغطي جزء بس من مرتبك الأخير. عشان كده ناس كتير في ألمانيا بتبني معاش خاص جنب الحكومي، وكل ما تبدأ بدري يبقى أسهل."]}], "de": [{"n": "Krankenversicherung", "d": "", "s": "Pflicht für jeden in Deutschland", "big": "Gesetzlich oder privat? Der Unterschied bei Preis und Leistung ist groß", "p": ["In Deutschland musst du krankenversichert sein. Aber gesetzlich (GKV) oder privat (PKV)? Das hängt von Einkommen, Beruf und Familie ab und lässt sich später nur schwer ändern."], "have": "Privat (PKV)", "no": "Gesetzlich (GKV)", "mn": "Krankenversicherung: gesetzlich, passt die private zu mir?", "opt": 1}, {"n": "Private Altersvorsorge", "d": "", "s": "Das ist deine Rente im Alter", "big": "Die gesetzliche Rente allein reicht nicht", "p": ["Die gesetzliche Rente deckt nur einen Teil deines letzten Gehalts. Deshalb bauen viele in Deutschland zusätzlich eine private Rente auf. Je früher du anfängst, desto leichter ist es."]}], "en": [{"n": "Health insurance", "d": "", "s": "Mandatory for everyone in Germany", "big": "Public or private? The difference in price and service is big", "p": ["In Germany you must have health insurance. But public (GKV) or private (PKV)? It depends on your income, job and family, and it is hard to change later."], "have": "Private (PKV)", "no": "Public (GKV)", "mn": "Health insurance: public, would private suit me?", "opt": 1}, {"n": "Private pension", "d": "", "s": "This is your pension when you are older", "big": "The state pension alone is not enough", "p": ["The state pension covers only part of your last salary. That is why many people in Germany build a private pension on top. The earlier you start, the easier it is."]}]};
var FQ={"ar": [{"fq": "بتدفع كتير للكاسة ومش واخد خدمة تستاهل؟", "fa": "ممكن بنفس الفلوس يبقى عندك تأمين خاص بخدمة أعلى", "b": "التأمين الخاص، حسب التعريفة: أوضة لوحدك في المستشفى، مواعيد أسرع، ومثلاً لحد 90% من تكلفة تركيبات الأسنان.", "fp": ["مناسب لو مرتبك فوق حوالي 77 ألف يورو في السنة، أو شغال حر، أو Beamter. أنا بحسبهالك قبل ما تقرر."]}, {"fq": "لو أذيت حد أو كسرت حاجة غالية من غير قصد، مين هيدفع؟", "fa": "إنت، من جيبك، ومن غير حد أقصى", "b": "التأمين بيدفع الضرر عنك: أضرار لحد 50 مليون يورو، حسب العقد."}, {"fq": "لو مبقتش تقدر تشتغل، الفلوس هتيجي منين؟", "fa": "من الدولة بييجي قليل جدًا وبشروط صعبة، وإنت اللي بتقع في المشكلة", "b": "التأمين بيدفعلك كل شهر، مثلاً 2000 يورو أو أكتر حسب العقد، لو مقدرتش تشتغل في مهنتك."}, {"fq": "هتعيش بكام لما تبطل شغل؟", "fa": "المعاش الحكومي ضعيف، ولوحده مش هيكفيك تعيش", "b": "المعاش الخاص بيدفعلك مبلغ كل شهر طول عمرك، زيادة على المعاش الحكومي."}, {"fq": "لو عملت حادثة، مين هيدفع تصليح عربيتك إنت؟", "fa": "التأمين الإجباري بيدفع للناس التانيين بس، مش ليك", "b": "التأمين بيغطي أضرار الغير لحد 100 مليون يورو، و Vollkasko بيدفع تصليح عربيتك إنت كمان."}, {"fq": "لو صاحب الشغل فصلك أو صاحب الشقة ظلمك، هتقدر تدفع محامي؟", "b": "التأمين بيدفع المحامي والمحكمة، مثلاً لحد مليون يورو أو أكتر حسب العقد."}, {"fq": "لو شقتك اتحرقت أو اتسرقت بكرة، هتشتري كل حاجة من جديد بإيه؟", "b": "التأمين بيعوضك بسعر الحاجة الجديدة، مثلاً لحد 650 يورو لكل متر مربع في شقتك."}], "de": [{"fq": "Zahlst du viel für die Krankenkasse und bekommst wenig dafür?", "fa": "Für das gleiche Geld kannst du vielleicht privat versichert sein, mit mehr Leistung", "b": "Privat, je nach Tarif: Einzelzimmer im Krankenhaus, schnellere Termine und zum Beispiel bis zu 90 % der Kosten für Zahnersatz.", "fp": ["Geeignet, wenn du angestellt über etwa 77.000 € im Jahr verdienst, selbstständig oder Beamter bist. Ich rechne es mit dir durch, bevor du entscheidest."]}, {"fq": "Wer zahlt, wenn du aus Versehen jemanden verletzt oder etwas Teures kaputt machst?", "fa": "Du, mit deinem eigenen Geld und ohne Obergrenze", "b": "Die Versicherung zahlt den Schaden für dich: je nach Vertrag bis zu 50 Millionen Euro."}, {"fq": "Woher kommt das Geld, wenn du nicht mehr arbeiten kannst?", "fa": "Vom Staat kommt sehr wenig, und nur unter strengen Bedingungen. Dann stehst du allein da", "b": "Die Versicherung zahlt dir jeden Monat, zum Beispiel 2.000 € oder mehr je nach Vertrag, wenn du deinen Beruf nicht mehr ausüben kannst."}, {"fq": "Wovon lebst du, wenn du aufhörst zu arbeiten?", "fa": "Die gesetzliche Rente ist schwach und reicht allein nicht zum Leben", "b": "Die private Rente zahlt dir jeden Monat einen Betrag, ein Leben lang, zusätzlich zur gesetzlichen."}, {"fq": "Wer zahlt nach einem Unfall die Reparatur an deinem eigenen Auto?", "fa": "Die Pflichtversicherung zahlt nur für die anderen, nicht für dich", "b": "Die Versicherung deckt Schäden bei anderen bis zu 100 Millionen Euro, und die Vollkasko zahlt auch die Reparatur an deinem eigenen Auto."}, {"fq": "Könntest du dir einen Anwalt leisten, wenn dein Chef dir kündigt oder dein Vermieter dich unfair behandelt?", "b": "Die Versicherung zahlt Anwalt und Gericht, zum Beispiel bis zu 1 Million Euro oder mehr je nach Vertrag."}, {"fq": "Wovon kaufst du alles neu, wenn deine Wohnung morgen brennt oder ausgeraubt wird?", "b": "Die Versicherung ersetzt dir alles zum Neuwert, zum Beispiel bis zu 650 € pro Quadratmeter deiner Wohnung."}], "en": [{"fq": "Paying a lot for health insurance and getting little for it?", "fa": "For the same money you might be privately insured, with more service", "b": "Private cover, depending on the tariff: a single room in hospital, faster appointments and, for example, up to 90% of the cost of dental prosthetics.", "fp": ["It fits if you are employed and earn more than about €77,000 a year, are self-employed or a civil servant. I run the numbers with you before you decide."]}, {"fq": "Who pays if you hurt someone or break something expensive by accident?", "fa": "You do, with your own money and with no upper limit", "b": "The insurance pays the damage for you: up to €50 million, depending on the contract."}, {"fq": "Where does the money come from when you can no longer work?", "fa": "The state pays very little, and only under strict conditions. Then you are on your own", "b": "The insurance pays you every month, for example €2,000 or more depending on the contract, if you can no longer work in your job."}, {"fq": "What will you live on when you stop working?", "fa": "The state pension is weak and not enough to live on by itself", "b": "A private pension pays you an amount every month for life, on top of the state pension."}, {"fq": "After an accident, who pays to repair your own car?", "fa": "The mandatory insurance only pays for the others, not for you", "b": "The insurance covers damage to others up to €100 million, and full cover (Vollkasko) also pays the repair of your own car."}, {"fq": "Could you afford a lawyer if your boss fires you or your landlord treats you unfairly?", "b": "The insurance pays the lawyer and the court, for example up to €1 million or more depending on the contract."}, {"fq": "How would you replace everything if your flat burned down or was robbed tomorrow?", "b": "The insurance replaces everything at new value, for example up to €650 per square metre of your flat."}]};

of these ETFs."}, {"t": "Fix a monthly amount", "p": "It runs automatically every month. Done."}], "ch": "Now the hard questions:", "h": "In 5 minutes: know how to start investing in Germany", "sol": "That is what I do. I have no products of my own: I compare banks and providers from across Germany, explain it in your language and handle the paperwork.", "msg": "Hi Karim, I want to start investing. What is the next step?", "pq": ["Which share do I invest in?", "Which ETF do I invest in?", "Which bank charges the lowest costs?", "Does it work without interest and riba?", "Is it reliable?"]}};

langfristig)']},{t:'Du investierst automatisch jeden Monat',p:'Mit deinem monatlichen Budget, über die nächsten Jahre, in ETFs.',q:'Was ist ein ETF?',a:'Eine Aktie ist wie eine einzelne Blume. Ein ETF ist der ganze Strauß: ein kleiner Anteil an hunderten großen Firmen der Welt auf einmal.',q2:'Ist das halal?',a2:'Nicht jeder ETF ist halal. Ein Halal-ETF wird nach Scharia-Kriterien geprüft: Er schließt Firmen aus, die mit Alkohol, Schweinefleisch, Glücksspiel, Waffen oder Zinsgeschäften Geld verdienen, und Firmen mit zu hohen Schulden. Ein Scharia-Gremium prüft den Fonds laufend. Sag mir, wenn dir das wichtig ist. Dann zeige ich dir, welche Möglichkeiten es gibt.',q3:'Ist mein Geld sicher?',a3:'Dein investiertes Geld wird getrennt vom Vermögen der Firma verwahrt und ist in Deutschland gesetzlich geschützt, auch wenn die Firma pleitegeht. Der Wert schwankt aber. Deshalb investiert man langfristig.',q4:'Mit wie viel kann ich anfangen?',a4:'Du kannst mit einem kleinen Betrag im Monat anfangen, passend zu deinem Budget, und ihn später erhöhen oder senken. Ruf mich an, dann legen wir gemeinsam den passenden Betrag fest.',q5:'Und wenn ich in meine Heimat zurückgehe?',a5:'Dein Geld bleibt dein Geld. In den meisten Fällen kannst du den Vertrag weiterführen, die Beiträge pausieren oder dir das Geld auszahlen lassen. Die Details hängen vom Vertrag und vom Land ab. Ich kläre sie mit dir, bevor du unterschreibst.'},{t:'Die Beratung kostet dich nichts',p:'Der Berater wird von den Firmen bezahlt, nicht von dir, und macht alle Papiere mit den Firmen für dich fertig.'}]},gh:'Guide + kostenloser Plan',tiles:['Investieren','Altersvorsorge','Krankenversicherung','Berufsunfähigkeit','Privathaftpflicht','Risikolebensversicherung'],

en:{dir:'ltr',t1:'Your plan',t2:'in 5 steps',lead:'For investments and the key insurances',hint:'Tap a step for more info',join:'Ask us',s1alt:"Message me on WhatsApp",s1p:"Tell me which topic interests you and I will call you.",abT:"Who I am",abN:"Karim Adel",abR:"Founder of Yalla Finanzen",abP:"I am German with Arab roots, and I did not always live here. I know the struggle of finding your way in a foreign country. So I created Yalla Finanzen: I explain everything and finish all the paperwork, and Germany has a lot of it. Done fast, without the hassle for you.",abS:[["4.9 ★", "on Google"], ["3", "languages"]],fqT:"Questions before you call",fqs:[["Do I have to sign up for anything?", "No. You ask and understand, the decision is yours alone, with no pressure."], ["What does the call cost?", "You pay me nothing. The provider you choose pays me."], ["Which language?", "Arabic, German or English, whichever you prefer."], ["What happens to my data?", "It stays with me and goes to no one without your consent."]],hotL:"Hotline",hotH:"Every day from 10 am to 6 pm",hotW:"Message me on WhatsApp",offL:"My office",offA:"Horbach · Uferstraße · Heidelberg",svT:'My services, step by step',ftEnd:'Call us or leave your number and we will get in touch',dLead:'Everything you need to know to start investing 👇🏼',callBtn:'I want to understand more',moreMsg:'Hi Karim, I want to understand more.',orWa:'or message me on WhatsApp',cIns:'The key insurances in Germany',cStart:'How to start in 5 minutes, for free',start:'Let\'s start',joinInv:'I want to invest',ft:'In 5 minutes: tell us what you are interested in and we will get back to you as soon as possible',ig:{h:'Investing in Germany, step by step',s:[{t:'You get in touch with me',p:'I find you the best:',b:['Bank (short term)','Insurance (mid to long term)']},{t:'You invest automatically every month',p:'With your monthly budget, over the coming years, in ETFs.',q:'What is an ETF?',a:'One share is like a single flower. An ETF is the whole bouquet: a small piece of hundreds of the world\'s biggest companies at once.',q2:'Is it halal?',a2:'Not every ETF is halal. A halal ETF is screened by Sharia criteria: it leaves out companies that earn money from alcohol, pork, gambling, weapons or interest-based banking, and companies with too much debt. A Sharia board reviews the fund regularly. Tell me if this matters to you and I will show you the available options.',q3:'Is my money safe?',a3:'Your invested money is kept separate from the company\'s own assets and is protected by law in Germany, even if the company goes bankrupt. Its value does go up and down, which is why investing is for the long term.',q4:'How much do I need to start?',a4:'You can start with a small monthly amount that fits your budget and raise or lower it later. Call me and we set the right amount together.',q5:'What if I move back home?',a5:'Your money stays yours. In most cases you can keep the contract, pause your payments or have the money paid out. The details depend on the contract and the country. I clarify them with you before you sign.'},{t:'The advice costs you nothing',p:'The advisor is paid by the companies, not by you, and does all the paperwork with the companies for you.'}]},gh:'Guide + free plan',tiles:['Investing','Retirement','Health insurance','Disability insurance','Personal liability','Life insurance'],
